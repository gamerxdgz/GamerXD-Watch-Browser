<!DOCTYPE html>
<html>

<head>
<title>GamerXD Browser</title>
<link rel="stylesheet" href="style.css">
</head>


<body>

<div class="watch">

<div id="boot">
<h1>⚡ GamerXD</h1>
<p>Starting Browser...</p>
<div class="loader"></div>
</div>


<div id="app">


<header>

<h2>🌐 GamerXD</h2>

<div id="clock">
00:00
</div>

</header>



<section id="home">


<input id="search"
placeholder="Search or enter URL">


<button onclick="search()">
🔍 Search
</button>


<div class="buttons">

<button onclick="openPage('https://github.com')">
💻 GitHub
</button>


<button onclick="openPage('https://www.youtube.com')">
▶️ YouTube
</button>


<button onclick="openPage('https://www.tiktok.com')">
🎵 TikTok
</button>


<button onclick="showSettings()">
⚙ Settings
</button>

</div>


</section>



<section id="browser">


<div class="topbar">

<button onclick="home()">
🏠
</button>


<button onclick="back()">
←
</button>


<button onclick="forward()">
→
</button>


<button onclick="reload()">
⟳
</button>

</div>



<div id="loading">
Loading...
<div class="loader"></div>
</div>


<iframe id="frame"></iframe>


</section>




<section id="settings">


<h3>⚙ Settings</h3>


<button onclick="theme()">
🌙 Change Theme
</button>


<button onclick="home()">
🏠 Home
</button>


</section>



</div>

</div>


<script src="browser.js"></script>

</body>
</html>
