<!DOCTYPE html>
<html>

<head>
    <title>GamerXD Browser v10.0</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="browser">

    <div id="boot">
        <h1>⚡ GamerXD</h1>
        <p>Starting Browser v10.0</p>
        <div class="loader"></div>
    </div>


    <div id="app">

        <header>
            <h2>🌐 GamerXD Browser</h2>
            <span id="clock"></span>
        </header>


        <nav>
            <button onclick="showHome()">🏠</button>
            <button onclick="newTab()">➕</button>
            <button onclick="showBookmarks()">⭐</button>
            <button onclick="showHistory()">📜</button>
            <button onclick="showSettings()">⚙️</button>
        </nav>


        <section id="home">

            <input id="search"
            placeholder="Search the web">

            <button onclick="searchWeb()">
                🔍 Search
            </button>


            <div class="cards">

                <button onclick="openPage('https://github.com')">
                    💻 GitHub
                </button>

                <button onclick="openPage('https://youtube.com')">
                    ▶️ YouTube
                </button>

                <button onclick="openPage('https://duckduckgo.com')">
                    🦆 Search
                </button>

            </div>

        </section>



        <section id="browser">

            <div id="tabs"></div>

            <div class="bar">

                <button onclick="back()">⬅</button>
                <button onclick="forward()">➡</button>
                <button onclick="reload()">⟳</button>

                <input id="url"
                placeholder="Website URL">

                <button onclick="go()">
                    Go
                </button>

            </div>


            <div id="loading">
                Loading...
                <div class="loader"></div>
            </div>


            <iframe id="page"></iframe>


        </section>




        <section id="bookmarks">
            <h3>⭐ Bookmarks</h3>
            <div id="bookmarkList"></div>
        </section>



        <section id="history">
            <h3>📜 History</h3>
            <div id="historyList"></div>
        </section>



        <section id="settings">
            <h3>⚙ Settings</h3>

            <button onclick="toggleTheme()">
                Change Theme
            </button>

        </section>


    </div>

</div>


<script src="core/engines.js"></script>
<script src="core/history.js"></script>
<script src="core/bookmarks.js"></script>
<script src="core/tabs.js"></script>
<script src="core/browser.js"></script>
<script src="app.js"></script>


</body>
</html>
